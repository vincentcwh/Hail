name: Android CI - Fork Build

on:
  push:
    branches:
      - main
      - manual-order

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub Actions secret SIGNING_KEYSTORE_BASE64" && exit 1)
          test -n "$SIGNING_STORE_PASSWORD" || (echo "Missing GitHub Actions secret SIGNING_STORE_PASSWORD" && exit 1)
          test -n "$SIGNING_KEY_ALIAS" || (echo "Missing GitHub Actions secret SIGNING_KEY_ALIAS" && exit 1)
          test -n "$SIGNING_KEY_PASSWORD" || (echo "Missing GitHub Actions secret SIGNING_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hail-release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/hail-release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate persistent signing credentials
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/hail-release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1 || {
            echo "::error::Signing keystore password or key alias is incorrect. Check SIGNING_STORE_PASSWORD and SIGNING_KEY_ALIAS."
            exit 1
          }
          keytool -certreq -keystore "$RUNNER_TEMP/hail-release.jks" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -file "$RUNNER_TEMP/hail-key-check.csr" >/dev/null 2>&1 || {
            echo "::error::Private-key password is incorrect. Check SIGNING_KEY_PASSWORD."
            exit 1
          }
          rm -f "$RUNNER_TEMP/hail-key-check.csr"
      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease
          echo "filename=$(jq -r '.elements.[0].outputFile' app/build/outputs/apk/release/output-metadata.json)" >> $GITHUB_ENV
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.filename }}
          path: app/build/outputs/apk/release/${{ env.filename }}
          archive: false
